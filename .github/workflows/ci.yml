name: CI

# Roda em todo push e PR. Nao faz deploy e NAO roda migration: a Vercel cuida do
# deploy, e migrar do CI atingiria o banco errado (ver README, secao Deploy).
on:
  push:
    branches: [main, "feat/**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: financial
          POSTGRES_PASSWORD: financial
          POSTGRES_DB: financial
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U financial"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://financial:financial@localhost:5433/financial
      DATABASE_URL_UNPOOLED: postgresql://financial:financial@localhost:5433/financial
      # Valores de teste. Nao ha' segredo real neste arquivo — e nao pode haver:
      # o repositorio e' publico ou pode vir a ser.
      AUTH_SECRET: ci-secret-sem-valor-fora-do-ci-0123456789
      # Hash de "passphrase publica do ci, sem valor nenhum". Nao e' segredo:
      # protege um banco descartavel de dados fabricados. Existe porque o spec
      # de senha errada precisa de um gate CONFIGURADO para poder recusa-la.
      APP_PASSWORD_HASH: scrypt$16384$8$1$2nhmByc308xRmU8PV1B_Lw$jc11TQqiBsWzXWq8biuPmTN32mF-BvJ5iEbZ2stHoobCYLp7unO9WDkEKsKS9-5kOhMVlb-yK85Jt114kcIb_g
      APP_TIMEZONE: America/Sao_Paulo
      # Congela "hoje" na data que o design assume, senao os specs de
      # vencimento mudariam de resultado todo dia.
      APP_FAKE_TODAY: "2026-08-01"
      # `TZ=UTC` de proposito: e' o fuso da Vercel, e e' onde o bug de virada de
      # mes aparece. Rodar no fuso de Brasilia esconderia exatamente o defeito
      # que os testes de periodo existem para pegar.
      TZ: UTC

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Verificar (tipos, lint, testes)
        run: pnpm verify

      - name: Migrar o banco do CI
        run: pnpm db:migrate

      - name: Instalar navegador do Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E
        run: pnpm e2e

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
